[project]
name = "snp-prioritization"
version = "0.1.0"
description = "Decompose Picard CrosscheckFingerprints' LOD into per-haplotype-block contributions to rank the SNPs driving a sample-swap call."
readme = "README.md"
authors = [
    { name = "Christian Ramirez", email = "christian.ramirez1@umassmed.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "numba>=0.60",
    "oxbow>=0.8.0",
    "polars>=1.0",
]

[project.scripts]
snp-prioritization = "snp_prioritization.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.23.8",
    "pytest>=9.0.3",
    "quak>=0.3.5",
]
